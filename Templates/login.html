<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> 
	<title>User / Client Login - JudicalGuides</title>
    <!-- Site icon -->
    <link rel="icon" href="http://judicalguides.iceiy.com/images/JudicalGuidesLogo.png" type="image/png" />
    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <!-- Custom CSS -->
    <style>
        body {
    background: linear-gradient(90deg, rgba(212,252,255,1) 0%, rgba(253,215,255,1) 48%, rgba(252,255,200,1) 100%);
    font-family: "Times New Roman", Times, serif;
    margin: 0;
    padding: 0;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    font-size: 18px;
}

.navbar-brand{
font-size: 25px;
font-weight: 600;
background: -webkit-radial-gradient(circle, rgba(63,94,251,1) 0%, rgba(252,70,107,1) 100%);
-webkit-background-clip: text;
-webkit-text-fill-color: transparent;
}

.container {
    background-color: #ffffff;
    padding: 20px;
    border-radius: 10px;
    box-shadow: 0px 0px 10px rgba(0, 0, 0, 0.1);
    width: 90%;
    max-width: 800px;
    display: flex;
    flex-direction: column;
}

.step-indicators {
    display: flex;
    justify-content: space-between;
    margin-bottom: 20px;
}

.step-indicator {
    text-align: center;
    position: relative;
    width: 100%;
    color: #ccc;
}

.step-indicator.active {
    color: #007bff;
}

.step-indicator i {
    font-size: 24px;
    display: block;
    margin-bottom: 5px;
}

.step-indicator span {
    display: block;
    font-size: 14px;
}

.step-indicator.active i {
    color: #007bff;
}

.step-indicator.active span {
    font-weight: bold;
}

h2 {
    margin-top: 0;
}

.form-step {
    display: none;
}

.form-step.active {
    display: block;
}

.form-group {
    position: relative;
    margin-bottom: 20px;
}

label {
    display: block;
    margin: 10px 0 5px;
    position: relative;
    font-weight: bold;
}

input[type="text"],
input[type="email"],
input[type="password"],
input[type="tel"],
select {
    width: 100%;
    padding: 10px;
    margin-bottom: 5px;
    border: 1px solid #cccccc;
    border-radius: 5px;
    box-sizing: border-box;
    font-family: "Times New Roman", Times, serif;
    transition: border-color 0.3s;
    font-weight: bold;
    font-size: 16px;
    color: blue;
}

input[type="text"]:focus,
input[type="email"]:focus,
input[type="password"]:focus,
input[type="tel"]:focus,
select:focus {
    border-color: #4caf50;
    font-weight: bold;
}

input[type="text"]::placeholder,
input[type="email"]::placeholder,
input[type="password"]::placeholder,
select::placeholder {
    color: #999999;
    font-weight: bold;
}

.form-navigation {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 20px;
}

button {
    background-color: #007bff;
    color: white;
    padding: 12px 20px;
    border: none;
    border-radius: 5px;
    cursor: pointer;
    font-weight: bold;
    font-size: 16px;
    font-family: "Times New Roman", Times, serif;
    transition: background-color 0.3s;
}

button.next {
    background-color: #007bff;
}

button.prev {
    background-color: red;
}

button.submit {
    background-color: #28a745;
}

button:disabled {
    background-color: #ccc;
    cursor: not-allowed;
}

.form-navigation .prev {
    margin-right: auto; /* Pushes the "Previous" button to the left */
}

.form-navigation .next {
    margin-left: auto; /* Pushes the "Next" button to the right */
}

.error-message {
    color: #dc3545;
    font-size: 12px;
    margin-top: 5px;
}

input:invalid, select:invalid {
    border-color: #dc3545;
}

input:valid, select:valid {
    border-color: #28a745;
    color: blue;
}

.form-group.checkbox-group {
    display: flex;
    align-items: center;
}

.form-group.checkbox-group input {
    width: auto;
    margin-right: 10px;
}

.form-group.checkbox-group label {
    margin: 0;
}

@media (max-width: 768px) {
    .form-group, .form-navigation button {
        width: 100%;
        box-sizing: border-box;
    }

    input, select {
        width: 100%;
    }
}
    </style>
</head>
<body>
<div class="container">
        <a class="navbar-brand" href="#">
            <img src="http://judicalguides.iceiy.com/images/JudicalGuidesLogo.png" alt="Logo" width="50" height="35" class="d-inline-block align-text-top">
            JudicalGuides
        </a>
        <h4 style="color:blue; text-align:center;">User Login</h4>
        <hr>
        <form id="regForm" method="POST">
		<div class="form-group">
        <label for="username"><i class="fa-solid fa-envelope"></i> Username</label>
        <input type="text" name="username" required>
        </div>
		<div class="form-group">
        <label for="password">  <i class="fas fa-lock icon"></i> Password</label>
        <input type="password" name ="password" required>
       </div>
        <button type="submit">Login</button>
    </form>
</body>
</html>
