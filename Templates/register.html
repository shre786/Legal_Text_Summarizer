<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register</title>
    <style>
        body {
            background: linear-gradient(90deg, rgba(212, 252, 255, 1) 0%, rgba(253, 215, 255, 1) 48%, rgba(252, 255, 200, 1) 100%);
            font-family: "Times New Roman", Times, serif;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-size: 18px;
        }

        .form-container {
            background: #ffffff;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.25);
            max-width: 500px;
            width: 90%;
            animation: fadeIn 0.8s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .form-container h2 {
            text-align: center;
            margin-bottom: 25px;
            color: #007bff;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }

        input[type="text"],
        input[type="email"],
        input[type="password"],
        input[type="tel"] {
            width: 100%;
            padding: 12px;
            margin-bottom: 15px;
            border: 2px solid #ccc;
            border-radius: 8px;
            box-sizing: border-box;
            transition: all 0.3s;
            background: #f9f9f9;
            font-weight: bold;
            color: #333;
        }

        input[type="text"]:focus,
        input[type="email"]:focus,
        input[type="password"]:focus,
        input[type="tel"]:focus {
            border-color: #007bff;
            outline: none;
            background: #e6f7ff;
            box-shadow: 0 0 8px rgba(0, 123, 255, 0.4);
        }

        input[type="text"]::placeholder,
        input[type="email"]::placeholder,
        input[type="password"]::placeholder {
            color: #777;
            font-weight: normal;
        }

        .btn-primary {
            width: 100%;
            background-color: #007bff;
            color: #ffffff;
            padding: 12px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.3s ease;
        }

        .btn-primary:hover {
            background-color: #0056b3;
        }

        .btn-primary:active {
            transform: scale(0.98);
        }

        /* Media Query for Better Responsiveness */
        @media (max-width: 600px) {
            .form-container {
                width: 100%;
                padding: 20px;
            }

            input[type="text"],
            input[type="email"],
            input[type="password"],
            input[type="tel"] {
                padding: 10px;
                font-size: 16px;
            }
        }
    </style>
</head>
<body>

    <div class="form-container">
        <h2>Register</h2>
        <form action="{{ url_for('register') }}" method="POST">
            <label for="username">Username</label>
            <input type="text" name="username" id="username" placeholder="Enter username" required>

            <label for="password">Password</label>
            <input type="password" name="password" id="password" placeholder="Enter password" required>

            <label for="name">First Name</label>
            <input type="text" name="name" id="name" placeholder="Enter first name" required>

            <label for="surname">Surname</label>
            <input type="text" name="surname" id="surname" placeholder="Enter surname" required>

            <label for="email">Email</label>
            <input type="email" name="email" id="email" placeholder="Enter email" required>

            <label for="address">Address</label>
            <input type="text" name="address" id="address" placeholder="Enter address" required>

            <label for="occupation">Occupation</label>
            <input type="text" name="occupation" id="occupation" placeholder="Enter occupation" required>

            <button type="submit" class="btn btn-primary">Register</button>
        </form>
    </div>

</body>
</html>
